name: Spurwing
kind: company
description: Spurwing is an enterprise-grade appointment scheduling, calendar, and
  time-management API. Its REST API powers booking widgets, marketplaces, SaaS, and
  healthcare scheduling with multi-user calendars, provider availability, group meetings,
  time-zone handling, and client booking. Public read and booking operations are scoped
  by a public Provider ID, while private operations use a Bearer API key. Spurwing
  joined Healthie.
