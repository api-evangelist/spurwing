meters:
- name: appointments_booked
  description: Appointments / bookings created through the API; likely a primary commercial cost driver.
  unit: appointments
  aggregation: sum
  dimensions:
  - account
  - provider
- name: provider_calendars
  description: Number of provider calendars (seats) managed on the account.
  unit: calendars
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track booking volume and active provider calendars against the contracted plan.
- name: Allocation
  description: Map provider calendars and booking volume to internal teams / cost centers.
- name: Optimization
  description: Right-size the number of active provider calendars and consolidate appointment types to fit the negotiated plan.
- name: Accountability
  description: Assign an owner for the Spurwing contract and review booking volume monthly against the agreement.
