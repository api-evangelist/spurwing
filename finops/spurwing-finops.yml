description: >-
  FinOps view of Spurwing scheduling API spend. Spurwing is sold commercially
  (contact sales / demo) rather than via a published usage-metered price list,
  so cost is primarily a negotiated subscription/contract rather than a
  per-call meter. Likely cost drivers are appointment/booking volume and the
  number of provider calendars (seats). Specific meters and rates are not
  reconciled.
notes: >-
  Cost drivers below are inferred from the documented product model
  (per-booking volume, per-provider calendars). Confirm actual billing
  dimensions, currency, and invoicing with Spurwing / Healthie during
  reconciliation.
