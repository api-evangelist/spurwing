specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Spurwing
providerId: spurwing
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Scheduling
- Appointments
- Booking
- Calendar
- Availability
- Rate Limiting
- Quotas
- Throttling
description: >-
  Spurwing does not publish specific public rate-limit values (RPM/RPD or
  per-endpoint quotas) in its open documentation or client libraries.
  Pagination via page_size and offset is supported on list endpoints
  (appointment types, appointments). Specific throttling thresholds are not
  reconciled in this artifact.
notes: >-
  Confirm any per-account or per-endpoint rate limits, burst handling, and
  throttled response codes directly with Spurwing / Healthie during
  reconciliation.
sources:
- https://docs.spurwing.io/
- https://github.com/SpurwingIO/Appointment-Scheduling-API
responseCodes:
  throttled: see provider documentation
limits:
- name: Requests Per Minute
  scope: account
  metric: requests
  limit: see provider documentation
  notes: No public RPM value is documented.
- name: Pagination
  scope: endpoint
  metric: records
  limit: page_size / offset
  notes: List endpoints accept page_size and offset query parameters for paging.
policies:
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor any Retry-After header when present.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
